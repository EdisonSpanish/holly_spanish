<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aprende Español - Lecturas e Interacción</title>
  <style>
    :root {
      --primary: #2c3e50;
      --accent: #3498db;
      --success: #2ecc71;
      --danger: #e74c3c;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: #333;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 850px;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1, h2, h3 { color: var(--primary); text-align: center; }

    .btn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      margin: 5px;
    }
    .btn:hover { background-color: #2980b9; }
    .btn:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    .btn-success { background-color: var(--success); }
    .btn-success:hover { background-color: #27ae60; }

    .hidden { display: none !important; }

    /* Menú */
    .grid-menu {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .menu-card {
      background: #edf2f7;
      padding: 18px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .menu-card:hover { border-color: var(--accent); background: #e2e8f0; }

    /* Controles */
    .controls-panel {
      background: #f1f5f9;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .text-display {
      font-size: 18px;
      line-height: 1.6;
      background: #fff;
      padding: 20px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      max-height: 350px;
      overflow-y: auto;
      margin-bottom: 20px;
    }

    /* Match */
    .match-container {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 20px;
    }
    .column { width: 48%; display: flex; flex-direction: column; gap: 10px; }
    .match-item {
      padding: 10px 14px;
      background: #edf2f7;
      border: 2px solid #cbd5e1;
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      font-size: 15px;
    }
    .match-item.selected { border-color: var(--accent); background: #ebf8ff; }
    .match-item.matched { border-color: var(--success); background: #f0fff4; opacity: 0.5; cursor: default; }

    /* Deletreo */
    .spelling-box { text-align: center; margin: 20px 0; }
    .spelling-box input {
      font-size: 20px;
      padding: 8px;
      text-align: center;
      width: 250px;
      letter-spacing: 2px;
      border: 2px solid #cbd5e1;
      border-radius: 6px;
    }

    /* Traducción */
    .trans-option {
      display: block;
      width: 100%;
      text-align: left;
      margin: 10px 0;
      padding: 14px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
    }
    .trans-option:hover { background: #f1f5f9; }
    .trans-option.correct-choice {
      background-color: #d1fae5;
      border-color: var(--success);
      color: #065f46;
      font-weight: bold;
    }
    .progress-tracker { text-align: center; font-weight: bold; color: var(--primary); margin-bottom: 15px; }
  </style>
</head>
<body>

<div class="container">
  <!-- PANTALLA 1: MENÚ -->
  <div id="view-menu">
    <h1>Juego de Español - Lecturas</h1>
    <p style="text-align:center;">Selecciona una lectura para comenzar:</p>
    <div id="menu-grid" class="grid-menu"></div>
  </div>

  <!-- PANTALLA 2: LECTURA Y TTS -->
  <div id="view-reading" class="hidden">
    <button class="btn" onclick="showMenu()">← Menú Principal</button>
    <h2 id="read-title"></h2>
    
    <div class="controls-panel">
      <div>
        <button class="btn" onclick="playTTS()">▶ Leer</button>
        <button class="btn" onclick="pauseTTS()">⏸ Pausar</button>
        <button class="btn" onclick="stopTTS()">⏹ Detener</button>
      </div>
      <div>
        <label for="rate">Velocidad: <span id="rate-val">0.9</span>x</label>
        <input type="range" id="rate" min="0.5" max="1.3" step="0.1" value="0.9" oninput="document.getElementById('rate-val').innerText = this.value">
      </div>
    </div>

    <div id="read-text" class="text-display"></div>
    <button class="btn btn-success" style="width: 100%;" onclick="startMatchGame()">Comenzar Ejercicios →</button>
  </div>

  <!-- PANTALLA 3: FASE 1 - MATCH -->
  <div id="view-match" class="hidden">
    <h2>Fase 1: Empareja el Vocabulario</h2>
    <p style="text-align:center;">Selecciona una palabra en español y su significado en inglés.</p>
    <div class="match-container">
      <div id="col-words" class="column"></div>
      <div id="col-defs" class="column"></div>
    </div>
    <button id="btn-next-spelling" class="btn btn-success hidden" style="width: 100%; margin-top: 20px;" onclick="startSpellingGame()">Ir al Deletreo →</button>
  </div>

  <!-- PANTALLA 4: FASE 2 - DELETREO -->
  <div id="view-spelling" class="hidden">
    <h2>Fase 2: Deletreo de Vocabulario</h2>
    <div id="spelling-progress" class="progress-tracker"></div>
    
    <div class="controls-panel" style="justify-content: center; width: 80%; margin: 0 auto 15px auto;">
      <label for="spelling-rate">Velocidad de audio: <span id="spelling-rate-val">0.8</span>x</label>
      <input type="range" id="spelling-rate" min="0.4" max="1.2" step="0.1" value="0.8" oninput="document.getElementById('spelling-rate-val').innerText = this.value">
    </div>

    <div class="spelling-box">
      <button class="btn" onclick="playSpellingAudio()">🔊 Escuchar Palabra</button><br><br>
      <input type="text" id="spelling-input" autocomplete="off" placeholder="Escribe aquí..." onkeyup="if(event.key==='Enter') checkSpelling()">
      <br><br>
      <button class="btn" onclick="checkSpelling()">Verificar</button>
      <p id="spelling-feedback" style="font-weight:bold; min-height:24px;"></p>
    </div>
    <button id="btn-next-trans" class="btn btn-success hidden" style="width: 100%; margin-top: 20px;" onclick="startTransGame()">Ir a Traducción →</button>
  </div>

  <!-- PANTALLA 5: FASE 3 - TRADUCCIÓN -->
  <div id="view-translation" class="hidden">
    <h2>Fase 3: Traducción de Frases</h2>
    <div id="trans-progress" class="progress-tracker"></div>
    <p id="trans-prompt" style="font-size: 18px; text-align:center; font-weight:bold; color: #2c3e50;"></p>
    <div id="trans-options"></div>
    <p id="trans-feedback" style="text-align:center; font-weight:bold; font-size: 18px; min-height:25px;"></p>
    <button id="btn-finish" class="btn btn-success hidden" style="width: 100%; margin-top: 20px;" onclick="showMenu()">¡Completado! Volver al Menú</button>
  </div>
</div>

// EFECTOS DE SONIDO (WEB AUDIO API)
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();

  if (type === 'success') {
    // Sonido armónico suave (Arpegio C Mayor: C5, E5, G5)
    const notes = [523.25, 659.25, 783.99]; 
    notes.forEach((freq, index) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (index * 0.08));
      
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime + (index * 0.08));
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (index * 0.08) + 0.25);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start(audioCtx.currentTime + (index * 0.08));
      osc.stop(audioCtx.currentTime + (index * 0.08) + 0.25);
    });
  } else if (type === 'error') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, audioCtx.currentTime); // A3
    osc.frequency.exponentialRampToValueAtTime(146.83, audioCtx.currentTime + 0.2); // D3
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.25);
  }
}

// REMOVER TILDES Y ACENTOS
function removeAccents(str) {
  return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

  document.getElementById('view-menu').classList.remove('hidden');
  document.getElementById('view-reading').classList.add('hidden');
  document.getElementById('view-match').classList.add('hidden');
  document.getElementById('view-spelling').classList.add('hidden');
  document.getElementById('view-translation').classList.add('hidden');
  renderMenu();
}

function renderMenu() {
  const grid = document.getElementById('menu-grid');
  grid.innerHTML = '';
  lecturas.forEach(l => {
    const card = document.createElement('div');
    card.className = 'menu-card';
    card.innerText = l.title;
    card.onclick = () => loadLecture(l.id);
    grid.appendChild(card);
  });
}

function loadLecture(id) {
  currentLecture = lecturas.find(l => l.id === id);
  document.getElementById('read-title').innerText = currentLecture.title;
  document.getElementById('read-text').innerText = currentLecture.text;
  
  document.getElementById('view-menu').classList.add('hidden');
  document.getElementById('view-reading').classList.remove('hidden');
}

// TTS CONTROL
function playTTS(textToRead = null, customRate = null) {
  window.speechSynthesis.cancel();
  const text = textToRead || currentLecture.text;
  const utterance = new SpeechSynthesisUtterance(text);
  if (ecuadorVoice) utterance.voice = ecuadorVoice;
  utterance.lang = 'es-EC';
  utterance.rate = customRate || parseFloat(document.getElementById('rate').value);
  window.speechSynthesis.speak(utterance);
}

function pauseTTS() { window.speechSynthesis.pause(); }
function stopTTS() { window.speechSynthesis.cancel(); }

// FASE 1: MATCH
function startMatchGame() {
  stopTTS();
  document.getElementById('view-reading').classList.add('hidden');
  document.getElementById('view-match').classList.remove('hidden');
  document.getElementById('btn-next-spelling').classList.add('hidden');
  
  matchedCount = 0;
  matchSelectedWord = null;
  matchSelectedDef = null;

  const colWords = document.getElementById('col-words');
  const colDefs = document.getElementById('col-defs');
  colWords.innerHTML = '';
  colDefs.innerHTML = '';

  const words = [...currentLecture.vocab].sort(() => Math.random() - 0.5);
  const defs = [...currentLecture.vocab].sort(() => Math.random() - 0.5);

  words.forEach(item => {
    const div = document.createElement('div');
    div.className = 'match-item';
    div.innerText = item.es;
    div.dataset.value = item.es;
    div.onclick = () => selectMatchItem(div, 'word');
    colWords.appendChild(div);
  });

  defs.forEach(item => {
    const div = document.createElement('div');
    div.className = 'match-item';
    div.innerText = item.en;
    div.dataset.value = item.es;
    div.onclick = () => selectMatchItem(div, 'def');
    colDefs.appendChild(div);
  });
}

function selectMatchItem(el, type) {
  if (el.classList.contains('matched')) return;

  if (type === 'word') {
    document.querySelectorAll('#col-words .match-item').forEach(i => i.classList.remove('selected'));
    matchSelectedWord = el;
  } else {
    document.querySelectorAll('#col-defs .match-item').forEach(i => i.classList.remove('selected'));
    matchSelectedDef = el;
  }
  el.classList.add('selected');

  if (matchSelectedWord && matchSelectedDef) {
    if (matchSelectedWord.dataset.value === matchSelectedDef.dataset.value) {
      playSound('success');
      matchSelectedWord.classList.add('matched');
      matchSelectedDef.classList.add('matched');
      matchedCount++;
      if (matchedCount === currentLecture.vocab.length) {
        document.getElementById('btn-next-spelling').classList.remove('hidden');
      }
    } else {
      playSound('error');
    }
    matchSelectedWord.classList.remove('selected');
    matchSelectedDef.classList.remove('selected');
    matchSelectedWord = null;
    matchSelectedDef = null;
  }
}

// FASE 2: DELETREO
function startSpellingGame() {
  currentSpellingIndex = 0;
  document.getElementById('view-match').classList.add('hidden');
  document.getElementById('view-spelling').classList.remove('hidden');
  document.getElementById('btn-next-trans').classList.add('hidden');
  loadSpellingWord();
}

function loadSpellingWord() {
  const inputEl = document.getElementById('spelling-input');
  inputEl.value = '';
  inputEl.disabled = false;
  inputEl.focus();
  document.getElementById('spelling-feedback').innerText = '';
  document.getElementById('spelling-progress').innerText = `Palabra ${currentSpellingIndex + 1} de ${currentLecture.vocab.length}`;
  playSpellingAudio();
}

function playSpellingAudio() {
  const word = currentLecture.vocab[currentSpellingIndex].es;
  const spellingRate = parseFloat(document.getElementById('spelling-rate').value);
  playTTS(word, spellingRate);
}

function checkSpelling() {
  const inputRaw = document.getElementById('spelling-input').value.trim();
  if (!inputRaw) return;

  const inputClean = removeAccents(inputRaw);
  const targetClean = removeAccents(currentLecture.vocab[currentSpellingIndex].es);
  const feedback = document.getElementById('spelling-feedback');

  if (inputClean === targetClean) {
    playSound('success');
    feedback.style.color = "var(--success)";
    feedback.innerText = "¡Correcto!";
    document.getElementById('spelling-input').disabled = true;

    setTimeout(() => {
      currentSpellingIndex++;
      if (currentSpellingIndex < currentLecture.vocab.length) {
        loadSpellingWord();
      } else {
        feedback.innerText = "¡Has completado todo el deletreo!";
        document.getElementById('btn-next-trans').classList.remove('hidden');
      }
    }, 1000);
  } else {
    playSound('error');
    feedback.style.color = "var(--danger)";
    feedback.innerText = "Incorrecto. Intenta de nuevo.";
  }
}

// FASE 3: TRADUCCIÓN
function startTransGame() {
  currentTransIndex = 0;
  document.getElementById('view-spelling').classList.add('hidden');
  document.getElementById('view-translation').classList.remove('hidden');
  document.getElementById('btn-finish').classList.add('hidden');
  loadTransQuestion();
}

function loadTransQuestion() {
  document.getElementById('trans-feedback').innerText = '';
  
  const qList = currentLecture.trans;
  document.getElementById('trans-progress').innerText = `Pregunta ${currentTransIndex + 1} de ${qList.length}`;
  
  const currentQ = qList[currentTransIndex];
  document.getElementById('trans-prompt').innerText = `"${currentQ.prompt}"`;

  const container = document.getElementById('trans-options');
  container.innerHTML = '';

  currentQ.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'trans-option';
    btn.innerText = opt;
    btn.onclick = () => {
      if (idx === currentQ.correct) {
        playSound('success');
        btn.classList.add('correct-choice');
        document.getElementById('trans-feedback').style.color = "var(--success)";
        document.getElementById('trans-feedback').innerText = "¡Correcto!";
        
        // Bloquear selecciones múltiples
        document.querySelectorAll('.trans-option').forEach(b => b.onclick = null);

        setTimeout(() => {
          currentTransIndex++;
          if (currentTransIndex < qList.length) {
            loadTransQuestion();
          } else {
            document.getElementById('trans-feedback').innerText = "¡Felicidades! Has completado todas las traducciones.";
            document.getElementById('btn-finish').classList.remove('hidden');
          }
        }, 1000);
      } else {
        playSound('error');
        document.getElementById('trans-feedback').style.color = "var(--danger)";
        document.getElementById('trans-feedback').innerText = "Opción incorrecta. Intenta de nuevo.";
      }
    };
    container.appendChild(btn);
  });
}

// Inicializar App
initVoices();
showMenu();
</script>
</body>
</html>
